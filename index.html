  menuButton(x, y, w, h, label, enabled, onClick){
    const g = this.add.graphics();
    const fill = enabled ? 0x3f6b3f : 0x2a332a;
    const stroke = enabled ? 0x8fd18f : 0x556155;
    g.fillStyle(fill, 1);
    g.fillRoundedRect(x-w/2, y-h/2, w, h, 10);
    g.lineStyle(3, stroke, 1);
    g.strokeRoundedRect(x-w/2, y-h/2, w, h, 10);
    this.add.text(x, y, label, {
      fontFamily:'"Press Start 2P"', fontSize:'18px',
      color: enabled ? '#f2ead9' : '#7c887c'
    }).setOrigin(0.5);
    if(!enabled){
      this.add.text(x, y+h/2+16, t('comingSoon'), {fontFamily:'"VT323"', fontSize:'16px', color:'#8a95a0'}).setOrigin(0.5);
    }
    if(enabled){
      const hit = this.add.rectangle(x, y, w, h, 0x000000, 0).setInteractive({useHandCursor:true});
      hit.on('pointerdown', onClick);
    }
  }
}

// ---- Ecran de choix de difficulte, entre le menu principal et la partie
// elle-meme (uniquement pour le mode "vs Adversaire" pour l'instant). Les
// regles precises de chaque mode sont appliquees dans MainScene en lisant
// la variable globale `difficulty`. ----
class DifficultyScene extends Phaser.Scene {
  constructor(){ super('difficulty'); }

  create(){
    this.cameras.main.setBackgroundColor(0x2e4928);
    this.render();
    const onResize = ()=>this.render();
    this.scale.on('resize', onResize);
    this.events.once('shutdown', ()=>{ this.scale.off('resize', onResize); });
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(()=>{ this.render(); });
    }
  }

  render(){
    if(!this.scene.isActive() || !this.cameras || !this.cameras.main) return;
    this.children.removeAll();
    // Comme le menu principal, cet ecran ne zoome pas non plus (pixels
    // ecran reels directement) : le bouton plein ecran (DOM) doit le savoir.
    window.__uiZoom = 1;
    if(window.__repositionFsButton) window.__repositionFsButton();
    const W = this.scale.width, H = this.scale.height;
    const cx = W/2;
    const isPortraitDiff = H > W;

    const frColor = lang==='fr' ? '#ffd23f' : '#8a95a0';
    const enColor = lang==='en' ? '#ffd23f' : '#8a95a0';
    const frLbl = this.add.text(20, 18, 'FR', {fontFamily:'"Press Start 2P"', fontSize:'11px', color:frColor}).setOrigin(0,0.5);
    frLbl.setInteractive({useHandCursor:true}).on('pointerdown', ()=>this.setLang('fr'));
    const enLbl = this.add.text(68, 18, 'EN', {fontFamily:'"Press Start 2P"', fontSize:'11px', color:enColor}).setOrigin(0,0.5);
    enLbl.setInteractive({useHandCursor:true}).on('pointerdown', ()=>this.setLang('en'));

    const titleSize = isPortraitDiff
      ? Math.max(22, Math.min(34, Math.round(W*0.05)))
      : Math.max(20, Math.min(30, Math.round(H*0.06)));
    const titleY = isPortraitDiff
      ? Math.max(60, Math.min(150, H*0.14))
      : Math.max(36, Math.min(90, H*0.12));
    this.add.text(cx, titleY, t('diffTitle'), {fontFamily:'"Press Start 2P"', fontSize:titleSize+'px', color:'#e9ddc8'}).setOrigin(0.5);

    const modes = [
      { key:'easy', label: t('diffEasy'), sub: t('diffEasySub') },
      { key:'normal', label: t('diffNormal'), sub: t('diffNormalSub') },
      { key:'hard', label: t('diffHard'), sub: t('diffHardSub') },
      { key:'nightmare', label: t('diffNightmare'), sub: t('diffNightmareSub') },
    ];

    if(isPortraitDiff){
      // Empile en 1 colonne verticale.
      const btnW = Math.min(380, W*0.86);
      const btnH = 66;
      const step = 84;
      let y = titleY + titleSize*0.9 + 46;
      modes.forEach(m=>{
        this.diffButton(cx, y, btnW, btnH, m.label, m.sub, ()=>{ difficulty = m.key; this.scene.start('main'); });
        y += step;
      });
    } else {
      // Grille 2x2 : sur un ecran paysage bas (telephone), une seule colonne
      // de 4 boutons+sous-titres deborde carrement de l'ecran (c'etait le
      // blocage rapporte -- le dernier bouton devenait inaccessible). La
      // grille tient dans beaucoup moins de hauteur.
      const btnW = Math.min(340, W*0.42);
      const btnH = 60;
      const gapX = 30, gapY = 34;
      const gridTop = titleY + titleSize*0.9 + 26;
      const col0X = cx - btnW/2 - gapX/2;
      const col1X = cx + btnW/2 + gapX/2;
      const row0Y = gridTop + btnH/2;
      const row1Y = row0Y + btnH + gapY;
      const positions = [[col0X,row0Y],[col1X,row0Y],[col0X,row1Y],[col1X,row1Y]];
      modes.forEach((m,i)=>{
        const [x,y] = positions[i];
        this.diffButton(x, y, btnW, btnH, m.label, m.sub, ()=>{ difficulty = m.key; this.scene.start('main'); });
      });
    }

    this.add.text(cx, H-24, 'Hugin Corp™', {fontFamily:'"VT323"', fontSize:'18px', color:'#e9ddc8'}).setOrigin(0.5).setAlpha(0.25);
  }

  diffButton(x, y, w, h, label, sub, onClick){
    const g = this.add.graphics();
    g.fillStyle(0x3f6b3f, 1);
    g.fillRoundedRect(x-w/2, y-h/2, w, h, 10);
    g.lineStyle(3, 0x8fd18f, 1);
    g.strokeRoundedRect(x-w/2, y-h/2, w, h, 10);
    this.add.text(x, y-8, label, {fontFamily:'"Press Start 2P"', fontSize:'17px', color:'#f2ead9'}).setOrigin(0.5);
    this.add.text(x, y+16, sub, {fontFamily:'"VT323"', fontSize:'14px', color:'#c9d6c0'}).setOrigin(0.5);
    const hit = this.add.rectangle(x, y, w, h, 0x000000, 0).setInteractive({useHandCursor:true});
    hit.on('pointerdown', onClick);
  }

  setLang(newLang){
    if(lang===newLang) return;
    lang = newLang;
    try{ localStorage.setItem('shithead_lang', newLang); }catch(e){}
    this.render();
  }
}

class MainScene extends Phaser.Scene {
  constructor(){ super('main'); }

  preload(){
    this.load.image('card_back', 'assets/cards/back.png');
    const files = {
      '2':'2.png','3':'3.png','4':'4.png','5':'5.png','6':'6.png','7':'7.png',
      '8':'8.png','9':'9.png','10':'10.png','J':'11-J.png','Q':'12-Q.png',
      'K':'13-K.png','A':'14-A.png'
    };
    for(const [rank, file] of Object.entries(files)){
      this.load.image(RANK_TO_TEXTURE[rank], 'assets/cards/'+file);
    }
  }

  create(){
    gameState = createGame();
    this.spriteByCardId = {};
    this.dragReleasePos = {};
    this.animating = false;
    this.awaitingFaceUpChoice = false;
    // Sans ca, Phaser demarre un "drag" des le moindre micro-mouvement de
    // souris entre l'appui et le relachement (quasi inevitable a la main),
    // et le clic simple se fait avaler par le systeme de drag au lieu de
    // declencher la selection. On exige un vrai deplacement avant de
    // considerer que c'est un glisser plutot qu'un clic.
    this.input.dragDistanceThreshold = 10;
    // Sans ca, Phaser ne revalide "qu'est-ce qui est sous le curseur" que
    // lors d'un vrai evenement souris natif (bouger, cliquer...). Or a
    // chaque redraw (typiquement juste apres le tour de l'IA), tous les
    // sprites sont detruits/recrees : si la souris ne bouge pas d'un pixel
    // entre temps, Phaser garde une notion perimee de ce qui est cliquable,
    // et ni le curseur "main" ni les clics ne fonctionnent tant qu'un
    // mouvement (ou un resize, comme ouvrir l'inspecteur) ne force une
    // reverification. setPollAlways() force cette reverification a chaque
    // frame plutot que d'attendre un evenement.
    this.input.setPollAlways();
    this.cameras.main.setBackgroundColor(0x2e4928);
    this.initLog();
    this.layoutAndDraw();
    const onResize = ()=>this.layoutAndDraw();
    this.scale.on('resize', onResize);
    // Sans ca, cet ecouteur reste actif meme apres avoir quitte la scene :
    // un redimensionnement/rotation d'ecran plus tard declenchait alors
    // layoutAndDraw() sur une scene eteinte -> crash.
    this.events.once('shutdown', ()=>{ this.scale.off('resize', onResize); });
    // Filet de securite : si les polices Google Fonts finissent de charger
    // APRES ce premier rendu, on redessine pour que le bon style s'applique
    // partout (sinon le canvas reste fige sur la police de secours).
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(()=>{ this.layoutAndDraw(); });
    }
    if(gameState.turn==='ai') this.time.delayedCall(700, ()=>this.aiLoop());
  }

  // ---- Relance une partie sans recharger la page : reinitialise l'etat de
  // jeu ET tout l'etat de scene qui pourrait sinon persister d'une partie a
  // l'autre (journal, selection, animation en cours...). ----
  restartGame(){
    gameState = createGame();
    this.spriteByCardId = {};
    this.dragReleasePos = {};
    this.animating = false;
    this.awaitingFaceUpChoice = false;
    selected = [];
    this.disarmWatchdog();
    this.logHistory = [];
    this.lastLogCount = 0;
    this.logLines.forEach(entry=>{ this.tweens.killTweensOf(entry.obj); entry.obj.destroy(); });
    this.logLines = [];
    this.render();
    if(gameState.turn==='ai') this.time.delayedCall(700, ()=>this.aiLoop());
  }

  // ---- Choisit la largeur du canevas virtuel paysage selon le ratio reel
  // de l'ecran, et cale la camera dessus : sur un telephone large, le
  // canevas s'elargit pour que le feutre remplisse tout l'ecran au lieu de
  // laisser des bandes vertes mortes sur les cotes (uniquement sur les
  // ecrans PLUS larges que le design d'origine 1280x900 ; sur un ecran plus
  // etroit/carre, on garde le comportement "fit" classique). Le zoom de
  // camera avait ete suspecte de casser la detection de clic apres le tour
  // de l'IA, mais teste et confirme innocent : le vrai bug etait un
  // probleme d'ordre dans afterAnimation() (voir plus bas), maintenant
  // corrige. Le zoom peut donc revenir sans risque.
  // Choisit le canevas virtuel (paysage large-et-court ou portrait
  // etroit-et-haut) selon le vrai ratio de l'ecran, et cale la camera
  // dessus. this.isPortrait pilote ensuite drawAll() vers la bonne mise en
  // page (drawAllLandscape / drawAllPortrait), qui sont deux presentations
  // assez differentes (la portrait n'a pas la place pour le journal, la
  // colonne de boutons a droite, etc.)
  layoutAndDraw(){
    if(!this.scene.isActive() || !this.cameras || !this.cameras.main) return;
    const W = this.scale.width, H = this.scale.height;
    // Resynchronise explicitement le viewport de la camera sur la taille
    // reelle du canevas a CHAQUE redimensionnement (rotation d'ecran, resize
    // navigateur...). Sans ca, en combinaison avec le zoom manuel utilise
    // plus bas, Phaser pouvait garder un viewport perime apres une rotation
    // -- le rendu semblait correct mais la conversion clic-ecran -> position
    // dans le jeu restait basee sur l'ancienne taille, rendant tout
    // ecran suivant sans effet jusqu'a un F5.
    this.cameras.main.setViewport(0, 0, W, H);
    this.isPortrait = H > W;
    if(this.isPortrait){
      const basePW = 720, basePH = 1280;
      const baseAspect = basePW/basePH; // 0.5625
      const screenAspect = W/H;
      let PW, PH, Z;
      if(screenAspect <= baseAspect){
        // ecran encore plus etroit/haut que le design de base : etire la
        // hauteur du canevas virtuel plutot que de laisser des bandes.
        PW = basePW;
        PH = Math.round(PW/screenAspect);
        Z = W/PW;
      } else {
        PH = basePH;
        PW = Math.round(PH*screenAspect);
        Z = H/PH;
      }
      this.W = PW;
      this.H = PH;
      this.cameras.main.setZoom(Z);
      this.cameras.main.centerOn(PW/2, PH/2);
      window.__uiZoom = Z;
    } else {
      const DH = 900;
      const baseAspect = 1280/900;
      const screenAspect = W/H;
      let DW, Z;
      if(screenAspect >= baseAspect){
        DW = Math.round(DH*screenAspect);
        Z = H/DH;
      } else {
        DW = 1280;
        Z = W/DW;
      }
      this.W = DW;
      this.H = DH;
      this.cameras.main.setZoom(Z);
      this.cameras.main.centerOn(DW/2, DH/2);
      window.__uiZoom = Z;
    }
    if(window.__repositionFsButton) window.__repositionFsButton();
    this.drawAll();
  }

  // Redessine avec la largeur actuelle, sans retoucher au zoom de la camera
  // (utilise par tous les rafraichissements "normaux" suite a une action ;
  // layoutAndDraw() est reserve au tout premier rendu et aux vrais
  // changements de taille/orientation d'ecran).
  render(){
    this.drawAll();
  }

  // ---- Journal persistant, reconstruit a chaque nouvelle entree (au lieu
  // de faire glisser/tweener un historique plus long) : plus simple et
  // beaucoup plus fiable, plus aucun risque qu'un ancien tween laisse une
  // ligne a mi-chemin ou desynchronisee. Seules les 2 dernieres actions
  // sont affichees. ----
  initLog(){
    this.logMaxVisible = 2;
    this.logLineH = 30;
    this.logPanelMinW = 260;
    this.logPanelW = this.logPanelMinW;
    const panelH = this.logLineH*this.logMaxVisible + 16;
    this.logPanelRight = 1270; // recale dynamiquement dans drawAll() selon la largeur reelle
    this.logPanelX = this.logPanelRight - this.logPanelW;
    this.logPanelY = 5;
    this.logPanelBg = this.add.graphics();
    this.logPanelBg.setDepth(4999);
    this.redrawLogPanelBg(panelH);
    this.logLines = []; // {obj, key, params} -- toujours au plus logMaxVisible
    this.logHistory = []; // {key, params} -- les entrees actuellement affichees
    this.lastLogCount = 0;
  }

  redrawLogPanelBg(panelH){
    this.logPanelBg.clear();
    this.logPanelBg.fillStyle(0x0c1410, 0.55);
    this.logPanelBg.fillRoundedRect(this.logPanelX, this.logPanelY, this.logPanelW, panelH, 6);
    this.logPanelBg.lineStyle(1, 0xd7a45c, 0.5);
    this.logPanelBg.strokeRoundedRect(this.logPanelX, this.logPanelY, this.logPanelW, panelH, 6);
  }

  // Ajoute toute nouvelle entree du journal du moteur depuis le dernier
  // appel (idempotent : ne fait rien si rien de neuf).
  syncLog(){
    const total = gameState.log.length;
    for(let i=this.lastLogCount; i<total; i++){
      const entry = gameState.log[i];
      this.pushLogLine(entry.key, entry.params);
    }
    this.lastLogCount = total;
  }

  // Cles des messages lies au combo de 8 (tour(s) bonus) : mise en valeur
  // particuliere, c'est une mecanique subtile qu'on veut faire remarquer.
  isCombo8Key(key){
    return key==='logBonus8You' || key==='logBonus8AI' ||
           key==='logBonusReplayYou' || key==='logBonusReplayAI';
  }

  pushLogLine(key, params){
    this.logHistory.push({ key, params });
    if(this.logHistory.length > this.logMaxVisible) this.logHistory.shift();

    // Reconstruit systematiquement les lignes affichees a partir de
    // l'historique courant (au plus logMaxVisible), plutot que d'essayer de
    // faire glisser/repositionner des objets existants : beaucoup plus
    // simple, et ca elimine toute la classe de bugs "une ligne reste a
    // mi-chemin / le panneau perd le fil" observee avec l'ancienne version.
    this.logLines.forEach(entry => { this.tweens.killTweensOf(entry.obj); entry.obj.destroy(); });
    this.logLines = [];

    const maxW = (this.W || 1280) * 0.38;
    const anchorX = this.logPanelRight - 10;

    // Chaque ligne retrecit sa PROPRE police si besoin pour tenir dans la
    // largeur max : plus jamais de texte qui deborde du panneau, meme une
    // phrase tres longue en mode responsive a grande police.
    const measured = this.logHistory.map(({key, params})=>{
      const text = t(key, params);
      let fontPx = Math.round(21 * (this.fontScale||1));
      const probe = this.add.text(0, 0, text, {fontFamily:'"VT323"', fontSize:fontPx+'px'}).setVisible(true).setAlpha(0);
      while(probe.width > maxW-20 && fontPx > 10){
        fontPx -= 2;
        probe.setFontSize(fontPx);
      }
      const w = probe.width;
      probe.destroy();
      return { key, params, text, fontPx, w };
    });

    // Le panneau lui-meme ne depasse JAMAIS maxW, meme si une ligne n'a pas
    // reussi a rentrer dedans avant d'atteindre le plancher de police (cas
    // limite rarissime) : le texte peut alors deborder tres legerement du
    // cadre plutot que le cadre lui-meme ne debordant sur le reste de
    // l'interface (ex: l'eventail de l'adversaire).
    const neededW = Math.min(maxW, Math.max(this.logPanelMinW, ...measured.map(m=>m.w+26)));
    if(neededW !== this.logPanelW){
      this.logPanelW = neededW;
      this.logPanelX = this.logPanelRight - this.logPanelW;
    }
    this.redrawLogPanelBg(this.logLineH*this.logMaxVisible + 16);

    measured.forEach((m, idx)=>{
      const targetY = this.logPanelY + 10 + idx*this.logLineH;
      const color = this.isCombo8Key(m.key) ? '#ffd23f' : '#a9b8c2';
      const obj = this.add.text(anchorX, targetY, m.text,
        {fontFamily:'"VT323"', fontSize:m.fontPx+'px', color, align:'right'}).setOrigin(1,0);
      obj.setDepth(5001);
      if(idx === measured.length-1){
        // Seule la toute derniere ligne (la plus recente) entre en fondu ;
        // les autres restent stables, pas de glissement a rejouer.
        obj.alpha = 0;
        this.tweens.add({ targets: obj, alpha:1, duration:260, ease:'Sine.easeOut' });
      }
      this.logLines.push({ obj, key:m.key, params:m.params });
    });
  }

  // Change de langue sans casser l'animation en cours : reconstruit le
  // journal a partir de l'historique conserve, avec les textes retraduits.
  refreshLogText(){
    const hist = this.logHistory.slice();
    this.logHistory = [];
    hist.forEach(({key, params})=>{ this.pushLogLine(key, params); });
  }

  // ---- Change de langue et persiste le choix pour la prochaine visite ----
  setLang(newLang){
    if(lang===newLang) return;
    lang = newLang;
    try{ localStorage.setItem('shithead_lang', newLang); }catch(e){}
    this.refreshLogText();
    this.render();
  }

  // ---- Continuation apres n'importe quelle action + son animation ----
  afterAnimation(){
    this.disarmWatchdog();
    this.animating = false;
    this.render();
    if(gameState.winner) return;
    if(gameState.turn==='ai') this.time.delayedCall(500, ()=>this.aiLoop());
  }

  // ---- Marque une action comme "en cours d'animation" + arme un
  // chien de garde : si jamais l'animation ne se termine pas normalement
  // (tween qui echoue a declencher son onComplete, focus de la fenetre qui
  // perturbe le timing, etc.), le jeu se debloque tout seul au bout de
  // quelques secondes plutot que de rester fige indefiniment. ----
  armAnimating(){
    this.animating = true;
    this.disarmWatchdog();
    this._animWatchdog = this.time.delayedCall(4000, ()=>{
      if(this.animating){
        this.animating = false;
        this.render();
        if(!gameState.winner && gameState.turn==='ai') this.time.delayedCall(300, ()=>this.aiLoop());
      }
    });
  }

  disarmWatchdog(){
    if(this._animWatchdog){ this._animWatchdog.remove(); this._animWatchdog = null; }
  }

  aiLoop(){
    if(gameState.winner || this.animating) return;
    this.armAnimating();
    const pileTopBefore = pileTop(gameState);
    const pileSnapshotBefore = [...gameState.pile];
    const res = aiTakeTurn(gameState);
    this.animateResult('ai', res, pileTopBefore, pileSnapshotBefore);
  }

  // ---- Aide : point de depart par defaut quand aucun sprite precis n'existe
  // (main de l'IA, generique puisque cachee) ----
  fallbackOrigin(who, fromZone){
    if(who==='ai' && fromZone==='hand'){
      return {x:this.aiHandX, y:this.aiHandOffY+70, scale:0.38, angle:0, textureKey:'card_back'};
    }
    // repli generique : centre de la pile
    return {x:this.pileX, y:this.pileY, scale:0.5, angle:0, textureKey:'card_back'};
  }

  // ---- Anime le resultat d'une action (jouer des cartes OU prendre le tas) ----
  animateResult(who, res, pileTopBefore, pileSnapshotBefore){
    if(!res || !res.ok){ this.animating = false; this.render(); return; }

    if(res.tookPile){
      if(res.fromZone==='faceDown' && res.card){
        // On revele d'abord la carte cachee tentee, sur place, avant le
        // ramassage : sinon le joueur ne voit jamais ce qu'il a sorti.
        this.animateFailedFaceDown(who, res.card, pileTopBefore, pileSnapshotBefore, res.takenCount || 0, ()=>this.afterAnimation());
      } else {
        this.animateTakePile(who, pileTopBefore, pileSnapshotBefore, res.takenCount || 0, res.faceUpCardTaken || null, ()=>this.afterAnimation());
      }
      return;
    }

    const cards = res.cards || (res.card ? [res.card] : []);
    if(cards.length===0){ this.afterAnimation(); return; }

    let remaining = cards.length;
    const onOneDone = ()=>{ remaining--; if(remaining<=0) this.afterAnimation(); };

    cards.forEach((card, i)=>{
      const dragOrigin = this.dragReleasePos[card.id];
      let origin, needsFlip;
      if(dragOrigin){
        // La carte vient d'un drag & drop : le vol reprend exactement la ou
        // elle a ete lachee, pour enchainer sans saut avec le geste du joueur.
        origin = { x:dragOrigin.x, y:dragOrigin.y, scale:dragOrigin.scale, angle:0, textureKey:RANK_TO_TEXTURE[card.rank] };
        needsFlip = false;
      } else if(this.spriteByCardId[card.id]){
        origin = this.captureSpriteOrigin(this.spriteByCardId[card.id]);
        needsFlip = origin.textureKey === 'card_back';
        // On retire tout de suite la sprite d'origine (celle du dernier
        // drawAll) : sinon elle reste affichee en double pendant que la
        // copie volante s'anime par dessus, ce qui donne un effet dedouble.
        this.spriteByCardId[card.id].destroy();
        delete this.spriteByCardId[card.id];
      } else {
        origin = this.fallbackOrigin(who, res.fromZone);
        needsFlip = origin.textureKey === 'card_back';
      }
      this.time.delayedCall(i*90, ()=>{
        this.flyCardToPile(origin, RANK_TO_TEXTURE[card.rank], needsFlip, i, onOneDone);
      });
    });
    this.dragReleasePos = {};
  }

  // ---- Face cachee qui echoue : on la retourne SUR PLACE pour la reveler,
  // on laisse le temps de la lire, puis seulement ensuite le tas est ramasse ----
  animateFailedFaceDown(who, card, pileTopBefore, pileSnapshotBefore, takenCount, onComplete){
    const origin = this.spriteByCardId[card.id]
      ? this.captureSpriteOrigin(this.spriteByCardId[card.id])
      : this.fallbackOrigin(who, 'faceDown');
    if(this.spriteByCardId[card.id]){
      this.spriteByCardId[card.id].destroy();
      delete this.spriteByCardId[card.id];
    }
    const spr = this.add.image(origin.x, origin.y, origin.textureKey).setScale(origin.scale).setDepth(2000);
    this.tweens.add({
      targets: spr, scaleX: 0, duration: 130, ease:'Sine.easeIn',
      onComplete: ()=>{
        spr.setTexture(RANK_TO_TEXTURE[card.rank]);
        this.tweens.add({
          targets: spr, scaleX: origin.scale, duration: 130, ease:'Sine.easeOut',
          onComplete: ()=>{
            // petit temps de lecture avant que le tas ne parte
            this.time.delayedCall(650, ()=>{
              spr.destroy();
              this.animateTakePile(who, pileTopBefore, pileSnapshotBefore, takenCount, null, onComplete);
            });
          }
        });
      }
    });
  }

  captureSpriteOrigin(spr){
    return { x:spr.x, y:spr.y, scale:spr.scaleX, angle:spr.angle, textureKey:spr.texture.key };
  }

  // ---- Vol d'une carte vers la pile, avec un petit flottement avant la pose ----
  flyCardToPile(origin, destTextureKey, needsFlip, stackIndex, onComplete){
    const spr = this.add.image(origin.x, origin.y, origin.textureKey);
    spr.setScale(origin.scale);
    spr.setAngle(origin.angle);
    spr.setDepth(2000 + stackIndex);

    const destX = this.pileX + stackIndex*3;
    const destY = this.pileY + stackIndex*2;
    const destScale = this.pileScale;
    const hoverX = destX, hoverY = destY - 55;

    const settle = ()=>{
      this.tweens.add({
        targets: spr, x: hoverX, y: hoverY, scale: destScale*1.08, angle:0,
        duration: 240, ease:'Sine.easeOut',
        onComplete: ()=>{
          this.time.delayedCall(260, ()=>{
            this.tweens.add({
              targets: spr, x: destX, y: destY, scale: destScale, angle:0,
              duration: 190, ease:'Sine.easeIn',
              onComplete: ()=>{ spr.destroy(); onComplete(); }
            });
          });
        }
      });
    };

    if(needsFlip){
      this.tweens.add({
        targets: spr, scaleX: 0, duration: 130, ease:'Sine.easeIn',
        onComplete: ()=>{
          spr.setTexture(destTextureKey);
          this.tweens.add({ targets: spr, scaleX: origin.scale, duration: 130, ease:'Sine.easeOut', onComplete: settle });
        }
      });
    } else {
      settle();
    }
  }

  // ---- Ramassage du tas : glisse et s'estompe vers la main du preneur ----
  animateTakePile(who, pileTopBefore, pileSnapshotBefore, takenCount, faceUpCardTaken, onComplete){
    const destX = who==='player' ? this.playerHandX : this.aiHandX;
    const destY = who==='player' ? this.playerHandOffY : this.aiHandOffY;
    // Gros tas (+10 cartes) : vol plus lent et en tournoyant, effet "banane
    // Mario Kart". En dessous, animation plus sobre : les vraies cartes
    // arrivent une par une, espacees, sans rotation.
    const bigPile = takenCount > 10;

    const labelSize = bigPile ? Math.min(46, 26 + takenCount) : 26;
    const label = this.add.text(this.pileX, this.pileY-40, t(bigPile ? 'takenLabelBig' : 'takenLabel', {n: takenCount}),
      {fontFamily:'"VT323"', fontSize:labelSize+'px', color:'#ff6b6b', stroke:'#1a1008', strokeThickness:4}).setOrigin(0.5).setDepth(2001);
    this.tweens.add({ targets: label, y: label.y-40, alpha:0, duration:700, ease:'Sine.easeOut' });

    // La carte face visible choisie (regle "phase decouverte") part aussi
    // vers la main, en parallele, plutot que de disparaitre d'un coup sans
    // transition (ce qui donnait l'impression que les autres se realignaient).
    let extraSpr = null;
    if(faceUpCardTaken && this.spriteByCardId[faceUpCardTaken.id]){
      const eo = this.captureSpriteOrigin(this.spriteByCardId[faceUpCardTaken.id]);
      this.spriteByCardId[faceUpCardTaken.id].destroy();
      delete this.spriteByCardId[faceUpCardTaken.id];
      extraSpr = this.add.image(eo.x, eo.y, eo.textureKey).setScale(eo.scale).setDepth(2000);
    }

    if(bigPile){
      const duration = 950;
      // On detruit tout de suite le sprite statique du dessus de la pile
      // (sinon il reste plante la pendant que les cartes individuelles
      // ci-dessous s'envolent par dessus, meme probleme de doublon que
      // pour le petit tas).
      if(pileTopBefore && this.spriteByCardId[pileTopBefore.id]){
        this.spriteByCardId[pileTopBefore.id].destroy();
        delete this.spriteByCardId[pileTopBefore.id];
      }
      if(extraSpr){
        this.tweens.add({ targets: extraSpr, x: destX, y: destY, scale:0.35, alpha:0, duration, ease:'Sine.easeInOut', onComplete: ()=>extraSpr.destroy() });
        this.tweens.add({ targets: extraSpr, angle: 720 + Math.random()*360, duration, ease:'Sine.easeInOut' });
      }
      // Plusieurs vraies cartes, chacune avec sa propre trajectoire/rotation
      // (effet banane Mario Kart), plafonnees pour ne pas surcharger l'ecran
      // meme sur un tas de 20+ cartes.
      const spinCount = Math.min(8, pileSnapshotBefore ? pileSnapshotBefore.length : 0);
      const shown = spinCount>0 ? pileSnapshotBefore.slice(-spinCount) : [];
      if(shown.length===0){
        const spr = this.add.image(this.pileX, this.pileY, 'card_back').setScale(1.0).setDepth(2000);
        this.tweens.add({
          targets: spr, x: destX, y: destY, scale:0.35, alpha:0, duration, ease:'Sine.easeInOut',
          onComplete: ()=>{ spr.destroy(); label.destroy(); onComplete(); }
        });
        this.tweens.add({ targets: spr, angle: 720 + Math.random()*360, duration, ease:'Sine.easeInOut' });
        return;
      }
      let remaining = shown.length;
      shown.forEach((c, i)=>{
        this.time.delayedCall(i*60, ()=>{
          const jitterX = this.pileX + (Math.random()*50-25);
          const jitterY = this.pileY + (Math.random()*36-18);
          const cs = this.add.image(jitterX, jitterY, RANK_TO_TEXTURE[c.rank]).setScale(0.9).setDepth(2000+i);
          const arcX = destX + (Math.random()*70-35);
          this.tweens.add({
            targets: cs, x: arcX, y: destY, scale:0.3, alpha:0,
            duration: duration - i*15, ease:'Sine.easeInOut',
            onComplete: ()=>{
              cs.destroy();
              remaining--;
              if(remaining<=0){ label.destroy(); onComplete(); }
            }
          });
          this.tweens.add({
            targets: cs, angle: (Math.random()<0.5?-1:1) * (540 + Math.random()*540),
            duration: duration - i*15, ease:'Sine.easeInOut'
          });
        });
      });
      return;
    }

    // ---- Petit tas : les vraies cartes arrivent une par une dans la main ----
    if(extraSpr){
      this.tweens.add({ targets: extraSpr, x: destX, y: destY, scale:0.4, alpha:0, duration:430, ease:'Sine.easeIn', onComplete: ()=>extraSpr.destroy() });
    }
    // La carte du dessus de la pile (affichee depuis le dernier drawAll)
    // doit disparaitre tout de suite : sinon elle reste plantee la pendant
    // que les cartes individuelles ci-dessous s'envolent par dessus.
    if(pileTopBefore && this.spriteByCardId[pileTopBefore.id]){
      this.spriteByCardId[pileTopBefore.id].destroy();
      delete this.spriteByCardId[pileTopBefore.id];
    }
    const shown = (pileSnapshotBefore && pileSnapshotBefore.length>0) ? pileSnapshotBefore.slice(-8) : [];
    if(shown.length===0){
      // Filet de securite si jamais aucun snapshot n'est disponible.
      const spr = this.add.image(this.pileX, this.pileY, 'card_back').setScale(1.0);
      spr.setDepth(2000);
      this.tweens.add({
        targets: spr, x: destX, y: destY, scale:0.35, alpha:0, duration:430, ease:'Sine.easeIn',
        onComplete: ()=>{ spr.destroy(); label.destroy(); onComplete(); }
      });
      return;
    }
    let remaining = shown.length;
    shown.forEach((c, i)=>{
      this.time.delayedCall(i*90, ()=>{
        const jitterX = this.pileX + (Math.random()*24-12);
        const jitterY = this.pileY + (Math.random()*16-8);
        const cs = this.add.image(jitterX, jitterY, RANK_TO_TEXTURE[c.rank]).setScale(0.85).setDepth(2000+i);
        this.tweens.add({
          targets: cs, x: destX + (Math.random()*30-15), y: destY, scale:0.32, alpha:0,
          duration: 430, ease:'Sine.easeIn',
          onComplete: ()=>{
            cs.destroy();
            remaining--;
            if(remaining<=0){ label.destroy(); onComplete(); }
          }
        });
      });
    });
  }

  addCardSprite(x, y, textureKey, scale, onClick, highlighted, angle, dragConfig){
    // Selection = la carte se souleve legerement, plutot qu'un cadre autour
    // (qui se chevauchait entre cartes voisines quand plusieurs etaient
    // choisies). Pas de lift si la carte est tournee (fan/cut), ca n'aurait
    // pas de sens visuellement dans ces cas-la (angle jamais combine a highlighted).
    const liftedY = highlighted ? y - 24*scale : y;
    const spr = this.add.image(x, liftedY, textureKey).setScale(scale);
    if(angle) spr.setAngle(angle);
    // Position de repos memorisee : sert de reference pour deplacer les
    // autres cartes du groupe en meme temps pendant un drag multi-carte.
    spr.restX = x; spr.restY = liftedY;

    if(dragConfig){
      spr.setInteractive({useHandCursor:true});
      this.input.setDraggable(spr);
      let dragged = false;
      let groupSprites = [];
      spr.on('dragstart', (pointer, dragX, dragY)=>{
        dragged = true;
        spr.setDepth(3000);
        groupSprites = [];
        // Si cette carte fait partie d'une selection multiple, les autres
        // cartes du groupe se REGROUPENT en petit paquet compact pres du
        // curseur (plutot que de garder leur espacement d'origine en main) :
        // plus facile a suivre d'un coup d'oeil et a viser au lachage.
        if(dragConfig.card && selected.length>1 && selected.some(s=>s.id===dragConfig.card.id)){
          let i = 0;
          for(const s of selected){
            if(s.id===dragConfig.card.id) continue;
            const gs = this.spriteByCardId[s.id];
            if(gs){
              i++;
              gs.setDepth(2999-i);
              gs.clusterOffsetX = i*9;
              gs.clusterOffsetY = i*6;
              gs.x = dragX + gs.clusterOffsetX;
              gs.y = dragY + gs.clusterOffsetY;
              groupSprites.push(gs);
            }
          }
        }
      });
      spr.on('drag', (pointer, dragX, dragY)=>{
        spr.x = dragX; spr.y = dragY;
        groupSprites.forEach(gs=>{
          gs.x = dragX + gs.clusterOffsetX;
          gs.y = dragY + gs.clusterOffsetY;
        });
      });
      spr.on('dragend', (pointer)=>{ dragConfig.onDrop(pointer); dragged = false; });
      spr.on('pointerup', ()=>{ if(!dragged && onClick) onClick(); });
    } else if(onClick){
      spr.setInteractive({useHandCursor:true});
      spr.on('pointerdown', onClick);
    }
    return spr;
  }

  drawStackedZone(centerX, centerY, faceDownCard, faceUpCard, scale, clickableUp, clickableDown){
    if(faceDownCard){
      const spr = this.addCardSprite(centerX, centerY, 'card_back', scale,
        clickableDown ? ()=>this.onPlayerFaceDownClick(faceDownCard) : null);
      this.spriteByCardId[faceDownCard.id] = spr;
    }
    if(faceUpCard){
      const isSel = selected.some(s=>s.id===faceUpCard.id);
      const dragCfg = clickableUp ? { onDrop: (pointer)=>this.onCardDropped(faceUpCard, pointer), card: faceUpCard } : null;
      const spr = this.addCardSprite(centerX, centerY - 6*scale, RANK_TO_TEXTURE[faceUpCard.rank], scale,
        clickableUp ? ()=>this.onPlayerCardClick(faceUpCard) : null, isSel, 0, dragCfg);
      this.spriteByCardId[faceUpCard.id] = spr;
    }
  }

  // ---- Aide UI : panneau semi-transparent derriere un texte pour la lisibilite ----
  panel(x, y, w, h, originX=0.5, originY=0.5, alpha=0.55){
    const px = x - w*originX, py = y - h*originY;
    const g = this.add.graphics();
    g.fillStyle(0x0c1410, alpha);
    g.fillRoundedRect(px, py, w, h, 6);
    g.lineStyle(1, 0xd7a45c, 0.5);
    g.strokeRoundedRect(px, py, w, h, 6);
    return g;
  }

  // Convertit une taille de police (nombre ou "Npx") en tenant compte du
  // boost responsive (this.fontScale, calcule dans drawAll selon la largeur
  // reelle de l'ecran). Utilise partout ou du texte est cree, pour que les
  // polices grossissent un peu sur les grands ecrans paysage.
  scaledFontSize(size){
    const scale = this.fontScale || 1;
    const n = parseFloat(size);
    if(isNaN(n)) return size;
    return Math.round(n*scale)+'px';
  }

  label(x, y, str, opts={}){
    const cfg = Object.assign({
      fontFamily:'"VT323"', fontSize:'20px', color:'#e9ddc8',
      align:'left'
    }, opts);
    cfg.fontSize = this.scaledFontSize(cfg.fontSize);
    const t = this.add.text(x, y, str, cfg);
    if(opts.originX!==undefined || opts.originY!==undefined) t.setOrigin(opts.originX||0, opts.originY||0);
    return t;
  }

  // ---- Panneau qui se dimensionne automatiquement autour du texte, pour
  // ne jamais deborder (mesure le texte avant de dessiner le fond) ----
  autoLabel(x, y, str, textOpts={}, panelOpts={}){
    const base = Object.assign({ fontFamily:'"VT323"', fontSize:'20px', color:'#e9ddc8' }, textOpts);
    const measure = this.add.text(0, 0, str, Object.assign({}, base, { fontSize: this.scaledFontSize(base.fontSize) })).setVisible(false);
    const w = measure.width, h = measure.height;
    measure.destroy();
    const padX = panelOpts.padX ?? 14, padY = panelOpts.padY ?? 7;
    const originX = textOpts.originX ?? 0, originY = textOpts.originY ?? 0;
    if(panelOpts.show !== false){
      this.panel(x, y, w+padX*2, h+padY*2, originX, originY, panelOpts.alpha ?? 0.55);
    }
    return this.label(x, y, str, textOpts);
  }

  // ---- Bouton rond (place "comme" A/B GBA, mais avec le mot ecrit dedans) :
  // la taille de police s'ajuste automatiquement pour tenir dans le cercle.
  // opts.dim = grise et desactive (ex: "Jouer" quand rien n'est jouable) ;
  // opts.highlight = anneau lumineux autour (ex: "Prendre" quand c'est la
  // seule option evidente), pour ne jamais laisser le joueur sans indice
  // clair sur quoi faire. ----
  roundButton(x, y, radius, fillColor, strokeColor, word, onClick, opts={}){
    if(opts.highlight){
      const glow = this.add.graphics();
      glow.lineStyle(5, 0xffe27a, 0.85);
      glow.strokeCircle(x, y, radius+6);
    }
    const alpha = opts.dim ? 0.35 : 1;
    const g = this.add.graphics();
    g.fillStyle(fillColor, alpha);
    g.fillCircle(x, y, radius);
    g.lineStyle(3, strokeColor, alpha);
    g.strokeCircle(x, y, radius);
    let fontSize = Math.round(16 * (this.fontScale||1));
    let txt = this.add.text(x, y, word, {fontFamily:'"Press Start 2P"', fontSize:fontSize+'px', color:'#1a1008'}).setOrigin(0.5).setAlpha(opts.dim ? 0.55 : 1);
    while(txt.width > radius*1.7 && fontSize > 7){
      fontSize--;
      txt.setFontSize(fontSize);
    }
    if(!opts.dim){
      const hit = this.add.circle(x, y, radius, 0x000000, 0).setInteractive({useHandCursor:true});
      hit.on('pointerdown', onClick);
    }
  }

  // Dispatch vers la bonne mise en page selon l'orientation detectee dans
  // layoutAndDraw().
  drawAll(){
    if(this.isPortrait) return this.drawAllPortrait();
    return this.drawAllLandscape();
  }

  drawAllLandscape(){
    // On detruit tout SAUF les elements persistants du journal (panneau de
    // fond + lignes en cours d'animation), qui gerent leur propre cycle de
    // vie via pushLogLine/syncLog pour un defilement anime plutot qu'un
    // redessin brutal a chaque tour.
    const preserved = new Set([this.logPanelBg, ...this.logLines.map(e=>e.obj)]);
    this.children.list.slice().forEach(child=>{ if(!preserved.has(child)) child.destroy(); });
    this.spriteByCardId = {};

    // Etirement horizontal : tout ce qui a ete pense pour un canevas
    // 1280 de large (le design d'origine) passe par sx() pour s'ecarter
    // proportionnellement du centre sur un ecran plus large, plutot que de
    // rester tasse au milieu avec du feutre vert mort sur les cotes. Les
    // coordonnees Y ne bougent pas (la hauteur logique reste 900).
    const W = this.W || 1280;
    const sx = (x) => W/2 + (x-640)*(W/1280);
    // Etirement attenue (40% de l'intensite normale) : pour les elements
    // qui doivent rester groupes/proches (les 3 cartes face visible/cachee)
    // meme sur un tres large ecran, plutot que de s'ecarter autant que le
    // reste de la table.
    const cx = (x) => W/2 + (x-640)*(1 + (W/1280-1)*0.4);
    // Boost de police sur les grands ecrans (paysage etire), plafonne a 1.5x
    // pour ne pas devenir absurde sur un ecran ultra-large.
    this.fontScale = Math.min(1.5, Math.max(1, W/1280));

    // Le panneau de journal est ancre au bord droit reel : s'il a bouge
    // depuis la derniere fois (largeur d'ecran changee), on le recale
    // (panneau + lignes deja affichees) sans casser leurs animations en cours.
    const newLogPanelRight = W - 10;
    if(this.logPanelRight !== newLogPanelRight){
      this.logPanelRight = newLogPanelRight;
      this.logPanelX = this.logPanelRight - this.logPanelW;
      this.redrawLogPanelBg(this.logLineH*this.logMaxVisible + 16);
      this.logLines.forEach(entry=>{ entry.obj.x = this.logPanelRight - 10; });
    }

    // Fond : juste un bandeau brun en haut (zone main de l'IA), le reste est
    // le feutre vert de la camera. Pas d'image fixe : que des couleurs, donc
    // ca s'etire proprement a n'importe quelle taille d'ecran.
    this.add.rectangle(W/2, 65, W, 130, 0x5a3a30).setOrigin(0.5);

    // Positions partagees avec les fonctions d'animation (vol de cartes,
    // ramassage du tas...), qui doivent savoir ou est la pile/la main peu
    // importe la largeur actuelle.
    this.pileX = sx(ZONES.pile.x);
    this.pileY = ty(ZONES.pile.y);
    this.pileScale = 1.25;
    this.pileDropRadius = 170;
    this.playerHandX = W/2;
    this.playerHandOffY = 900;
    this.aiHandX = W/2;
    this.aiHandOffY = -20;

    // ---- Bouton FR/EN (coin haut-gauche, hors du chemin de tout le reste,
    // toujours colle au vrai bord gauche donc pas de sx() ici) ----
    const frColor = lang==='fr' ? '#ffd23f' : '#8a95a0';
    const enColor = lang==='en' ? '#ffd23f' : '#8a95a0';
    const frLbl = this.label(20, 18, 'FR', {fontFamily:'"Press Start 2P"', fontSize:'11px', color:frColor, originY:0.5});
    frLbl.setInteractive({useHandCursor:true}).on('pointerdown', ()=>this.setLang('fr'));
    const enLbl = this.label(68, 18, 'EN', {fontFamily:'"Press Start 2P"', fontSize:'11px', color:enColor, originY:0.5});
    enLbl.setInteractive({useHandCursor:true}).on('pointerdown', ()=>this.setLang('en'));

    // ---- Compteur de tours, discret, juste sous le toggle FR/EN ----
    this.label(20, 45, t('turnCounter', {n: gameState.turnCount}),
      {fontSize:'15px', color:'#8a95a0', originY:0.5});

    // ---- Bandeau adversaire (au dessus de la table) : main cachee ----
    const aiHandCount = gameState.ai.hand.length;
    const fanCount = Math.min(aiHandCount, 7);
    // Meme principe d'arc + rotation que la main du joueur (mais mirroir :
    // les cartes du centre plongent LEGEREMENT vers la table plutot que de
    // remonter), pour que l'eventail de l'adversaire ait aussi un cote
    // "tenu en main".
    const aiArcHeight = 0.25 * CARD_H * 0.38;
    const aiMaxAngle = 10;
    const aiHalfSpan = (fanCount-1)/2 || 1;
    for(let i=0;i<fanCount;i++){
      const u = fanCount>1 ? (i-(fanCount-1)/2)/aiHalfSpan : 0;
      const y = 50 + aiArcHeight*(1-u*u);
      const angle = aiMaxAngle*u;
      this.addCardSprite(W/2 - (fanCount-1)*12 + i*24, y, 'card_back', 0.38, null, false, angle);
    }
    // Juste le nombre reel de cartes (pas de texte "MAIN ADVERSAIRE :"),
    // colle a GAUCHE de l'eventail visuel (le journal, en haut a droite,
    // peut deborder assez loin a gauche avec une phrase longue -- a droite
    // le chiffre se faisait donc parfois recouvrir). Masque en mode
    // Cauchemar : aucune info de comptage n'est donnee dans ce mode.
    if(difficulty!=='nightmare'){
      this.label(W/2 - (fanCount-1)*12 - 24 - 14, 50, `${aiHandCount}`,
        {fontFamily:'"Press Start 2P"', fontSize:'12px', color:'#e9ddc8', originX:1, originY:0.5});
    }

    // ---- Zones face cachee / face visible de l'IA (miroir, plus petites) ----
    for(let i=0;i<3;i++){
      const z = ZONES.aiSlots[i];
      const fd = gameState.ai.faceDown.find(c=>c.slot===i);
      const fu = gameState.ai.faceUp.find(c=>c.slot===i);
      this.drawStackedZone(cx(z.x), ty(z.y), fd, fu, 0.5, false, false);
    }

    // ---- Pile centrale ----
    const top = pileTop(gameState);

    // Eventail des 2 cartes jouees juste avant celle du dessus (avec elle, ca
    // fait la suite de 3 a connaitre pour couper via un 3). Pivot = vrai coin
    // bas-gauche de la carte du dessus. La plus ancienne (angle le plus fort)
    // doit etre dessinee EN PREMIER (couche du dessous), sinon elle recouvre
    // la plus recente qui devrait au contraire etre presque sous la carte du
    // dessus. Valide visuellement avant integration (voir /home/claude/fan_test).
    const TOP_SCALE = 1.25;
    const FAN_SCALE = 1.15;
    const pivotX = this.pileX - (CARD_W*TOP_SCALE)/2;
    const pivotY = this.pileY + (CARD_H*TOP_SCALE)/2;

    // Sous l'eventail, chaque carte au-dela des 3 affichees (dessus + 2 du
    // fan) continue le meme mouvement que les 2 cartes du fan (previous2
    // juste en dessous) : MEME pivot, la rotation continue au-dela de -32°.
    // L'angle est calcule d'apres la VRAIE position de la carte dans la
    // pile (pas une fraction du nombre total recalculee a chaque fois) :
    // chaque carte garde donc un angle stable au fil de la partie, et une
    // nouvelle carte prend simplement la place juste derriere le fan
    // (angle le plus proche de -32°) en poussant toutes les autres un peu
    // plus loin -- plutot que de s'inserer entre la plus ancienne et le
    // fan, ou de faire bouger les cartes deja en place (ce qui donnait un
    // ordre d'apparition bizarre). Pas de Math.random (deterministe).
    // Plafonne aux 24 plus RECENTES des cartes "en trop" (les plus proches
    // du fan, donc les plus pertinentes a montrer).
    const hiddenCount = Math.max(0, gameState.pile.length - 3);
    const shownExtras = Math.min(24, hiddenCount);
    const anglePerCard = 4;
    for(let depth=shownExtras; depth>=1; depth--){
      const spr = this.add.image(pivotX, pivotY, 'card_back');
      spr.setOrigin(0,1);
      spr.setScale(FAN_SCALE);
      spr.setAngle(-32 - depth*anglePerCard);
    }

    const previous2 = gameState.pile.slice(-3,-1); // ordre : plus ancien -> plus recent
    previous2.forEach((c, idx)=>{
      const depthFromTop = previous2.length - idx; // ancien=2, recent=1
      const spr = this.add.image(pivotX, pivotY, RANK_TO_TEXTURE[c.rank]);
      spr.setOrigin(0,1);
      spr.setScale(FAN_SCALE);
      spr.setAngle(-16*depthFromTop);
    });

    if(top){
      const sprTop = this.addCardSprite(this.pileX, this.pileY, RANK_TO_TEXTURE[top.rank], 1.25);
      this.spriteByCardId[top.id] = sprTop;
    }
    // Numero a DROITE de la pile (a gauche il se faisait recouvrir par
    // l'eventail, qui deborde de ce cote-la). Masque en mode Cauchemar.
    if(difficulty!=='nightmare'){
      this.label(this.pileX+78, this.pileY, `${gameState.pile.length}`,
        {fontFamily:'"Press Start 2P"', fontSize:'16px', color:'#c9d6e3', originX:0.5, originY:0.5});
    }

    // ---- Deck (pioche) : tranches derriere qui disparaissent au fil des dernieres cartes ----
    const deckX = sx(ZONES.deck.x), deckY = ty(ZONES.deck.y);
    const deckSliverCount = Math.min(2, Math.max(0, gameState.deck.length-1));
    for(let i=deckSliverCount; i>=1; i--){
      this.addCardSprite(deckX + i*13, deckY, 'card_back', 1.25);
    }
    if(gameState.deck.length>0){
      this.addCardSprite(deckX, deckY, 'card_back', 1.25);
    }
    this.autoLabel(deckX, deckY+95, `${gameState.deck.length}`,
      {fontSize:'18px', originX:0.5, originY:0.5}, {alpha:0.45});

    // ---- Cut / cartes hors jeu : empilement chaotique, un angle fige par coupe ----
    const cutX = sx(ZONES.cut.x), cutY = ty(ZONES.cut.y);
    gameState.cutBatches.forEach((batch, i)=>{
      this.addCardSprite(cutX, cutY, 'card_back', 1.0, null, false, batch.angle);
    });
    this.autoLabel(cutX, cutY+70, t('cutCount', {n: gameState.discardOut.length}),
      {fontSize:'17px', originX:0.5, originY:0.5}, {alpha:0.45});

    // ---- Contraintes / guerre : colonne de gauche, sous le message de
    // statut (zone deja verifiee degagee, aucun lien horizontal avec la
    // pile/l'eventail donc plus aucun risque de collision, contrairement a
    // l'espace juste au-dessus de la pile qui s'est revele trop etroit
    // entre la zone adversaire et le sommet de l'eventail). ----
    if(gameState.forceMax!==null){
      this.autoLabel(20, 145, t('forceConstraint'),
        {fontFamily:'"Press Start 2P"', fontSize:'9px', color:'#f0a840', originY:0.5},
        {alpha:0.6});
    }
    if(gameState.war){
      const round = gameState.war.round || 1;
      const turnWord = gameState.turn==='player' ? t('turnYou') : t('turnAI');
      this.autoLabel(20, 175,
        t('battle', {n: round, turn: turnWord}),
        {fontFamily:'"Press Start 2P"', fontSize:'9px', color:'#ff5f5f', originY:0.5},
        {alpha:0.65});
    }

    // ---- Zones face cachee / face visible du joueur ----
    const pZoneInfo = getActiveZoneCards(gameState.player);
    // Garde-fou centrale : les cartes du joueur (main + face visible/cachee)
    // ne doivent JAMAIS etre cliquables/glissables en dehors de son propre
    // tour (turn/winner/animating), sinon on peut interagir pendant que
    // l'IA joue (coupe, rejoue...) et provoquer un vrai crash en pleine
    // mutation de gameState pendant un drag.
    const isPlayerTurn = gameState.turn==='player' && !gameState.winner && !this.animating;
    for(let i=0;i<3;i++){
      const z = ZONES.playerSlots[i];
      const fd = gameState.player.faceDown.find(c=>c.slot===i);
      const fu = gameState.player.faceUp.find(c=>c.slot===i);
      const canClickUp = isPlayerTurn && pZoneInfo.zone==='faceUp';
      const canClickDown = isPlayerTurn && pZoneInfo.zone==='faceDown';
      this.drawStackedZone(cx(z.x), ty(z.y), fd, fu, 1.05, canClickUp, canClickDown);
    }

    // ---- Main du joueur (sous la table) ----
    // Rangee A PLAT (plus d'arc) et remontee : sur un vrai telephone, la
    // barre d'adresse + la zone de geste Android bouffent une bonne partie
    // de la hauteur reelle, donc chaque pixel de marge en bas compte pour
    // eviter de declencher le bouton/geste "accueil" du telephone en jouant.
    const handY = 720;
    const isHandActive = isPlayerTurn && pZoneInfo.zone==='hand';
    // Mode Facile : main triee automatiquement. Sinon (Normal/Difficile/
    // Cauchemar) : ordre naturel de gameState.player.hand, modifiable par le
    // joueur lui-meme via glisser-deposer (voir onCardDropped).
    const hand = difficulty==='easy' ? sortHandDisplay(gameState.player.hand) : gameState.player.hand;
    // La main se resserre (spacing) puis retrecit (scale) automatiquement
    // pour toujours tenir dans l'espace dispo, meme apres avoir ramasse
    // un gros tas. L'espace dispo suit la largeur reelle de l'ecran.
    // C'est l'element principal du jeu : base largement agrandie par
    // rapport aux zones face visible/cachee, qui sont secondaires.
    const N = hand.length;
    const maxHandWidth = W - 100;
    const minSpacing = 22;
    const baseHandScale = 1.7;
    let handScale = baseHandScale;
    let spacing = 109;
    if(N>1){
      const desiredWidth = (N-1)*spacing + CARD_W*handScale;
      if(desiredWidth > maxHandWidth){
        spacing = Math.max(minSpacing, (maxHandWidth - CARD_W*handScale) / (N-1));
        const widthAtMinSpacing = (N-1)*minSpacing + CARD_W*handScale;
        if(widthAtMinSpacing > maxHandWidth){
          handScale = Math.max(0.5, (maxHandWidth - (N-1)*minSpacing) / CARD_W);
          spacing = minSpacing;
        }
      }
    }
    this.handStartX = W/2 - (N-1)*spacing/2;
    this.handSpacing = spacing;
    this.handY = handY;
    const startX = this.handStartX;
    hand.forEach((c,i)=>{
      const isSel = selected.some(s=>s.id===c.id);
      // Une carte non jouable par rapport a l'etat actuel de la pile est
      // grisee et non interactive UNIQUEMENT en mode Facile (sauf si deja
      // selectionnee, pour pouvoir toujours la deselectionner si l'etat de
      // la pile a change entre temps). Les autres modes n'indiquent rien :
      // au joueur de reperer lui-meme ce qui est jouable.
      const playable = isHandActive ? canPlayGroup(gameState, c.rank) : true;
      const interactive = isHandActive && (playable || isSel || difficulty!=='easy');
      // Glisser est toujours actif des que la main est active : soit pour
      // jouer (si la carte est valide et lachee sur la pile), soit pour
      // reordonner la main a la main (Normal/Difficile/Cauchemar, voir
      // onCardDropped) meme si la carte n'est pas jouable dans l'immediat.
      const dragCfg = isHandActive ? { onDrop: (pointer)=>this.onCardDropped(c, pointer), card: c } : null;
      const spr = this.addCardSprite(startX + i*spacing, handY, RANK_TO_TEXTURE[c.rank], handScale,
        interactive ? ()=>this.onPlayerCardClick(c) : null, isSel, 0, dragCfg);
      if(difficulty==='easy' && isHandActive && !playable){
        // Grisage adouci : l'ancienne version (alpha 0.42 + gris 0x777777)
        // rendait les cartes un peu illisibles.
        spr.setAlpha(0.65);
        spr.setTint(0xaaaaaa);
      }
      this.spriteByCardId[c.id] = spr;
    });

    // ---- Statut / boutons ----
    let statusMsg = '';
    let statusColor = '#e9ddc8';
    if(gameState.winner){
      statusMsg = gameState.winner==='player' ? t('statusWin') : t('statusLose');
      statusColor = gameState.winner==='player' ? '#5fdc7a' : '#ff5f5f';
    } else if(gameState.turn==='ai'){
      statusMsg = t('statusAITurn');
    } else if(this.awaitingFaceUpChoice){
      statusMsg = t('statusChooseFaceUp');
      statusColor = '#f0a840';
    } else {
      statusMsg = selected.length ? t('statusSelected', {n: selected.length}) : t('statusChoose');
    }
    // Sous le compteur de tours, en haut a gauche : assez bas pour ne plus
    // passer sous le bouton plein ecran (bouton HTML par dessus le canevas,
    // qui ne bouge plus de son coin pour l'instant).
    this.autoLabel(20, 110, statusMsg,
      {fontFamily:'"Press Start 2P"', fontSize:'11px', color:statusColor, originY:0.5},
      {padX:15, padY:9, alpha:0.55});

    // ---- Boutons ronds : colonne libre a droite (sous le journal, a cote
    // du deck sans le toucher), avec un rayon qui grossit avec l'ecran
    // (fontScale) pour rester lisibles/cliquables sur un large paysage
    // etire, la ou l'espace entre les decouvertes et la main est trop
    // serre pour les agrandir sur place. ----
    if(gameState.turn==='player' && !gameState.winner){
      const btnX = W - 100;
      const btnScale = this.fontScale;
      // Si aucune carte de la zone active n'est jouable, "Prendre" est la
      // seule option sensee : plutot que de laisser le joueur sans indice
      // (certains s'attendent a ce que ca se ramasse tout seul), on grise
      // "Jouer" et on met "Prendre" en surbrillance.
      const noPlayableMove = !this.awaitingFaceUpChoice && gameState.pile.length>0 && (
        (pZoneInfo.zone==='hand' && !hand.some(c=>canPlayGroup(gameState, c.rank))) ||
        (pZoneInfo.zone==='faceUp' && !gameState.player.faceUp.some(c=>canPlayGroup(gameState, c.rank)))
      );
      if(!this.awaitingFaceUpChoice){
        this.roundButton(btnX, 420, 42*btnScale, 0x2f8f4e, 0x5fdc7a, t('btnPlay'), ()=>this.onPlayClick(),
          { dim: noPlayableMove });
      }
      // "Prendre le tas" n'a aucun sens si la pile est vide (tout est
      // jouable dans ce cas) : on masque carrement le bouton plutot que de
      // laisser un bouton cliquable qui ne fait rien, pour que ce soit
      // evident qu'il faut jouer une carte. En mode Cauchemar, egalement
      // masque des qu'un coup jouable existe (coherent avec le blocage de
      // onTakeClick : impossible de "prendre" tant qu'on peut jouer).
      const canShowTake = (gameState.pile.length>0 || this.awaitingFaceUpChoice) &&
        (difficulty!=='nightmare' || noPlayableMove || this.awaitingFaceUpChoice);
      if(canShowTake){
        const takeWord = this.awaitingFaceUpChoice ? t('btnCancel') : t('btnTake');
        this.roundButton(btnX, 540, 34*btnScale, 0x9a2f2f, 0xff5f5f, takeWord, ()=>this.onTakeClick(),
          { highlight: noPlayableMove });
      }
    }

    // ---- Log (panneau persistant + defilement anime, voir syncLog) ----
    this.syncLog();

    // ---- Grand emoji + texte de fin de partie, par dessus tout le reste ----
    if(gameState.winner){
      const isWin = gameState.winner==='player';
      const emoji = isWin ? '🏆' : '💀';
      const bigWord = isWin ? t('victory') : t('defeat');
      const wordColor = isWin ? '#ffd23f' : '#ff4d4d';
      this.add.circle(W/2, 370, 110, 0x0c1410, 0.55);
      this.add.text(W/2, 370, emoji, {fontSize:'150px'}).setOrigin(0.5);
      this.add.text(W/2+2, 502, bigWord,
        {fontFamily:'"Press Start 2P"', fontSize:'40px', color:'#1a1008'}).setOrigin(0.5);
      this.add.text(W/2, 500, bigWord,
        {fontFamily:'"Press Start 2P"', fontSize:'40px', color:wordColor}).setOrigin(0.5);
      // Sous-titre : nombre de tours, meme couleur/police que le mot
      // au-dessus, juste plus petit.
      const turnsSub = t('turnsSubtitle', {n: gameState.turnCount});
      this.add.text(W/2+1, 549, turnsSub,
        {fontFamily:'"Press Start 2P"', fontSize:'16px', color:'#1a1008'}).setOrigin(0.5);
      this.add.text(W/2, 548, turnsSub,
        {fontFamily:'"Press Start 2P"', fontSize:'16px', color:wordColor}).setOrigin(0.5);
      // Vrai bouton pour rejouer, plus besoin de rafraichir la page.
      this.roundButton(W/2, 630, 44*(this.fontScale||1), 0x2f8f4e, 0x5fdc7a, t('btnReplay'), ()=>this.restartGame());
    }
  }

  // ---- Mise en page PORTRAIT : premiere vraie implementation (avant,
  // isPortrait etait fige a false avec un TODO). Verticalement plus
  // contrainte donc plus compacte : pas de colonne de boutons a droite (ils
  // passent cote a cote au-dessus de la main), pas de journal (pas la place,
  // et demande explicitement retiree dans ce mode), main sur DEUX rangees
  // pour ne jamais s'etaler hors ecran meme avec beaucoup de cartes. Budget
  // vertical verifie par le calcul avant integration, mais pas encore teste
  // sur un vrai telephone -- des ajustements sont a prevoir. ----
  drawAllPortrait(){
    const preserved = new Set([this.logPanelBg]);
    this.children.list.slice().forEach(child=>{ if(!preserved.has(child)) child.destroy(); });
    this.spriteByCardId = {};
    // Pas de journal en portrait (pas la place) : on vide le panneau et les
    // lignes existantes, mais on garde lastLogCount synchronise pour ne pas
    // deverser tout l'historique d'un coup si on repasse en paysage.
    if(this.logPanelBg) this.logPanelBg.clear();
    this.logLines.forEach(entry=>{ this.tweens.killTweensOf(entry.obj); entry.obj.destroy(); });
    this.logLines = [];
    this.lastLogCount = gameState.log.length;

    const W = this.W, H = this.H || 1280;
    const cx = W/2;
    this.fontScale = Math.min(1.35, Math.max(1, W/720));

    // La zone de jeu (adversaire+pile+joueur+boutons) occupe les 60% du
    // haut, la main les 40% du bas -- mais H peut s'etirer bien au-dela de
    // 1280 sur un ecran tres etroit/haut. Sans ca, les positions fixes
    // restaient tassees en haut pendant que la main (calculee depuis H)
    // partait tres bas, laissant un grand vide au milieu. Tout se cale
    // desormais en PROPORTION de la bande disponible, et grossit avec elle
    // (spaceScale) pour profiter du surplus d'espace plutot que de le
    // laisser vide.
    const gameAreaTop = 115;
    const gameAreaBottom = H*0.6;
    const bandH = gameAreaBottom - gameAreaTop;
    const baseBandH = 653; // le budget calcule/valide pour H=1280
    const posY = (frac) => gameAreaTop + frac*bandH;
    const spaceScale = Math.min(1.6, Math.max(1, bandH/baseBandH));

    this.pileScale = 1.1 * spaceScale;
    this.playerHandX = cx;
    this.aiHandX = cx;
    this.aiHandOffY = -20;

    // Fond : bandeau brun en haut, comme en paysage.
    this.add.rectangle(cx, 60, W, 110, 0x5a3a30).setOrigin(0.5);

    // FR/EN (coin haut-gauche, position absolue comme en paysage)
    const frColor = lang==='fr' ? '#ffd23f' : '#8a95a0';
    const enColor = lang==='en' ? '#ffd23f' : '#8a95a0';
    const frLbl = this.label(20, 18, 'FR', {fontFamily:'"Press Start 2P"', fontSize:'11px', color:frColor, originY:0.5});
    frLbl.setInteractive({useHandCursor:true}).on('pointerdown', ()=>this.setLang('fr'));
    const enLbl = this.label(68, 18, 'EN', {fontFamily:'"Press Start 2P"', fontSize:'11px', color:enColor, originY:0.5});
    enLbl.setInteractive({useHandCursor:true}).on('pointerdown', ()=>this.setLang('en'));

    // Compteur de tours
    this.label(20, 45, t('turnCounter', {n: gameState.turnCount}),
      {fontSize:'15px', color:'#8a95a0', originY:0.5});

    // ---- Bandeau adversaire : eventail + compte reel a gauche ----
    const aiHandCount = gameState.ai.hand.length;
    const fanCount = Math.min(aiHandCount, 7);
    const aiScale = 0.32 * spaceScale;
    const aiFanY = posY(0.0536);
    const aiArcHeight = 0.22 * CARD_H * aiScale;
    const aiMaxAngle = 9;
    const aiHalfSpan = (fanCount-1)/2 || 1;
    for(let i=0;i<fanCount;i++){
      const u = fanCount>1 ? (i-(fanCount-1)/2)/aiHalfSpan : 0;
      const y = aiFanY + aiArcHeight*(1-u*u);
      const angle = aiMaxAngle*u;
      this.addCardSprite(cx - (fanCount-1)*10*spaceScale + i*20*spaceScale, y, 'card_back', aiScale, null, false, angle);
    }
    if(difficulty!=='nightmare'){
      this.label(cx - (fanCount-1)*10*spaceScale - 20*spaceScale - 12, aiFanY, `${aiHandCount}`,
        {fontFamily:'"Press Start 2P"', fontSize:'12px', color:'#e9ddc8', originX:1, originY:0.5});
    }

    // ---- Zone face cachee/visible de l'adversaire (3 slots, spacing reduit) ----
    const aiSlotSpacing = Math.min(95, (W-60)/2.4) * spaceScale;
    const aiZoneY = posY(0.1915);
    for(let i=0;i<3;i++){
      const x = cx + (i-1)*aiSlotSpacing;
      const fd = gameState.ai.faceDown.find(c=>c.slot===i);
      const fu = gameState.ai.faceUp.find(c=>c.slot===i);
      this.drawStackedZone(x, aiZoneY, fd, fu, 0.45*spaceScale, false, false);
    }

    // ---- Pile centrale (deck a droite, cut a gauche, plus rapproches
    // qu'en paysage vu la largeur reduite) ----
    const top = pileTop(gameState);
    this.pileX = cx;
    this.pileY = posY(0.4211);
    const TOP_SCALE = this.pileScale;
    const FAN_SCALE = 0.85 * spaceScale;
    const pivotX = this.pileX - (CARD_W*TOP_SCALE)/2;
    const pivotY = this.pileY + (CARD_H*TOP_SCALE)/2;

    const hiddenCount = Math.max(0, gameState.pile.length-3);
    const shownExtras = Math.min(24, hiddenCount);
    const anglePerCard = 4;
    for(let depth=shownExtras; depth>=1; depth--){
      const spr = this.add.image(pivotX, pivotY, 'card_back');
      spr.setOrigin(0,1);
      spr.setScale(FAN_SCALE);
      spr.setAngle(-32 - depth*anglePerCard);
    }
    const previous2 = gameState.pile.slice(-3,-1);
    previous2.forEach((c, idx)=>{
      const depthFromTop = previous2.length - idx;
      const spr = this.add.image(pivotX, pivotY, RANK_TO_TEXTURE[c.rank]);
      spr.setOrigin(0,1);
      spr.setScale(FAN_SCALE);
      spr.setAngle(-16*depthFromTop);
    });
    if(top){
      const sprTop = this.addCardSprite(this.pileX, this.pileY, RANK_TO_TEXTURE[top.rank], TOP_SCALE);
      this.spriteByCardId[top.id] = sprTop;
    }
    if(difficulty!=='nightmare'){
      this.label(this.pileX+58*spaceScale, this.pileY, `${gameState.pile.length}`,
        {fontFamily:'"Press Start 2P"', fontSize:'14px', color:'#c9d6e3', originX:0.5, originY:0.5});
    }

    const deckX = cx + 112*spaceScale, deckY = this.pileY;
    const deckSliverCount = Math.min(2, Math.max(0, gameState.deck.length-1));
    for(let i=deckSliverCount; i>=1; i--){
      this.addCardSprite(deckX + i*9, deckY, 'card_back', TOP_SCALE);
    }
    if(gameState.deck.length>0) this.addCardSprite(deckX, deckY, 'card_back', TOP_SCALE);
    this.label(deckX, deckY+70*spaceScale, `${gameState.deck.length}`,
      {fontSize:'14px', color:'#c9d6e3', originX:0.5, originY:0.5});

    const cutX = cx - 112*spaceScale, cutY = this.pileY;
    gameState.cutBatches.forEach(batch=>{
      this.addCardSprite(cutX, cutY, 'card_back', 0.7*spaceScale, null, false, batch.angle);
    });
    this.autoLabel(cutX, cutY+54*spaceScale, t('cutCount', {n: gameState.discardOut.length}),
      {fontSize:'14px', originX:0.5, originY:0.5}, {alpha:0.45});

    // ---- Contraintes / guerre (colonne gauche, comme en paysage) ----
    if(gameState.forceMax!==null){
      this.autoLabel(20, 145, t('forceConstraint'),
        {fontFamily:'"Press Start 2P"', fontSize:'9px', color:'#f0a840', originY:0.5},
        {alpha:0.6});
    }
    if(gameState.war){
      const round = gameState.war.round || 1;
      const turnWord = gameState.turn==='player' ? t('turnYou') : t('turnAI');
      this.autoLabel(20, 175, t('battle', {n: round, turn: turnWord}),
        {fontFamily:'"Press Start 2P"', fontSize:'9px', color:'#ff5f5f', originY:0.5},
        {alpha:0.65});
    }

    // ---- Zone face cachee/visible du joueur ----
    const pZoneInfo = getActiveZoneCards(gameState.player);
    const isPlayerTurn = gameState.turn==='player' && !gameState.winner && !this.animating;
    const playerSlotSpacing = Math.min(105, (W-60)/2.4) * spaceScale;
    const playerZoneY = posY(0.6279);
    for(let i=0;i<3;i++){
      const x = cx + (i-1)*playerSlotSpacing;
      const fd = gameState.player.faceDown.find(c=>c.slot===i);
      const fu = gameState.player.faceUp.find(c=>c.slot===i);
      const canClickUp = isPlayerTurn && pZoneInfo.zone==='faceUp';
      const canClickDown = isPlayerTurn && pZoneInfo.zone==='faceDown';
      this.drawStackedZone(x, playerZoneY, fd, fu, 0.75*spaceScale, canClickUp, canClickDown);
    }

    // ---- Boutons Jouer/Prendre, cote a cote au-dessus de la main (pas de
    // colonne libre a droite en portrait, la largeur est trop precieuse) ----
    const btnY = posY(0.7657);
    if(gameState.turn==='player' && !gameState.winner){
      const noPlayableMove = !this.awaitingFaceUpChoice && gameState.pile.length>0 && (
        (pZoneInfo.zone==='hand' && !sortHandDisplay(gameState.player.hand).some(c=>canPlayGroup(gameState, c.rank))) ||
        (pZoneInfo.zone==='faceUp' && !gameState.player.faceUp.some(c=>canPlayGroup(gameState, c.rank)))
      );
      if(!this.awaitingFaceUpChoice){
        this.roundButton(cx-68*spaceScale, btnY, 32*this.fontScale*spaceScale, 0x2f8f4e, 0x5fdc7a, t('btnPlay'), ()=>this.onPlayClick(),
          { dim: noPlayableMove });
      }
      const canShowTake = (gameState.pile.length>0 || this.awaitingFaceUpChoice) &&
        (difficulty!=='nightmare' || noPlayableMove || this.awaitingFaceUpChoice);
      if(canShowTake){
        const takeWord = this.awaitingFaceUpChoice ? t('btnCancel') : t('btnTake');
        this.roundButton(cx+68*spaceScale, btnY, 28*this.fontScale*spaceScale, 0x9a2f2f, 0xff5f5f, takeWord, ()=>this.onTakeClick(),
          { highlight: noPlayableMove });
      }
    }

    // ---- Statut ----
    let statusMsg = '';
    let statusColor = '#e9ddc8';
    if(gameState.winner){
      statusMsg = gameState.winner==='player' ? t('statusWin') : t('statusLose');
      statusColor = gameState.winner==='player' ? '#5fdc7a' : '#ff5f5f';
    } else if(gameState.turn==='ai'){
      statusMsg = t('statusAITurn');
    } else if(this.awaitingFaceUpChoice){
      statusMsg = t('statusChooseFaceUp');
      statusColor = '#f0a840';
    } else {
      statusMsg = selected.length ? t('statusSelected', {n: selected.length}) : t('statusChoose');
    }
    this.autoLabel(20, 110, statusMsg,
      {fontFamily:'"Press Start 2P"', fontSize:'10px', color:statusColor, originY:0.5},
      {padX:12, padY:8, alpha:0.55});

    // ---- Main du joueur : occupe les 40% du bas de l'ecran (comme demande),
    // sur DEUX RANGEES (jamais une seule rangee etiree hors-ecran quelle que
    // soit la taille de la main). La rangee "arriere" (plus haute) recoit la
    // moitie basse des cartes, la "avant" (plus basse, la plus proche du
    // joueur) le reste + la carte surnumeraire si la main est impaire.
    // Chaque rangee garde son propre arc leger. ----
    const hand = difficulty==='easy' ? sortHandDisplay(gameState.player.hand) : gameState.player.hand;
    const N = hand.length;
    const isHandActive = isPlayerTurn && pZoneInfo.zone==='hand';
    const rowFrontCount = Math.ceil(N/2);
    const rowBackCount = N - rowFrontCount;
    const rowBack = hand.slice(0, rowBackCount);
    const rowFront = hand.slice(rowBackCount);

    const maxHandWidth = W - 50;
    const minSpacing = 22;
    const baseHandScale = 1.6 * Math.min(1.25, spaceScale);
    const widestRow = Math.max(1, rowFrontCount, rowBackCount);
    let handScale = baseHandScale;
    let spacing = 96;
    const desiredWidth = (widestRow-1)*spacing + CARD_W*handScale;
    if(desiredWidth > maxHandWidth){
      spacing = Math.max(minSpacing, (maxHandWidth - CARD_W*handScale)/(widestRow-1 || 1));
      const widthAtMinSpacing = (widestRow-1)*minSpacing + CARD_W*handScale;
      if(widthAtMinSpacing > maxHandWidth){
        handScale = Math.max(0.5, (maxHandWidth - (widestRow-1)*minSpacing)/CARD_W);
        spacing = minSpacing;
      }
    }
    const arcHeight = 0.22 * CARD_H * handScale;
    const frontY = H - 30 - (CARD_H*handScale)/2;
    const backY = frontY - 100;
    this.handStartX = cx; // approximatif (2 rangees) : sert de repere large pour le reorder
    this.handSpacing = spacing;
    this.handY = frontY;

    const layoutRow = (cards, rowY, allowInteract)=>{
      const n = cards.length;
      const startX = cx - (n-1)*spacing/2;
      const half = (n-1)/2 || 1;
      cards.forEach((c,i)=>{
        const isSel = selected.some(s=>s.id===c.id);
        const playable = isHandActive ? canPlayGroup(gameState, c.rank) : true;
        const interactive = allowInteract && isHandActive && (playable || isSel || difficulty!=='easy');
        const dragCfg = (allowInteract && isHandActive) ? { onDrop: (pointer)=>this.onCardDropped(c, pointer), card: c } : null;
        const u = n>1 ? (i-(n-1)/2)/half : 0;
        const cardY = rowY - arcHeight*(1-u*u);
        const spr = this.addCardSprite(startX + i*spacing, cardY, RANK_TO_TEXTURE[c.rank], handScale,
          interactive ? ()=>this.onPlayerCardClick(c) : null, isSel, 0, dragCfg);
        if(difficulty==='easy' && isHandActive && !playable){
          spr.setAlpha(0.65);
          spr.setTint(0xaaaaaa);
        }
        this.spriteByCardId[c.id] = spr;
      });
    };
    // La rangee arriere est dessinee EN PREMIER (sous la rangee avant),
    // mais reste pleinement interactive : rien n'empeche de jouer une carte
    // qui s'y trouve.
    layoutRow(rowBack, backY, true);
    layoutRow(rowFront, frontY, true);

    if(gameState.winner){
      const isWin = gameState.winner==='player';
      const emoji = isWin ? '🏆' : '💀';
      const bigWord = isWin ? t('victory') : t('defeat');
      const wordColor = isWin ? '#ffd23f' : '#ff4d4d';
      this.add.circle(cx, 500, 100, 0x0c1410, 0.55);
      this.add.text(cx, 500, emoji, {fontSize:'130px'}).setOrigin(0.5);
      this.add.text(cx+2, 620, bigWord,
        {fontFamily:'"Press Start 2P"', fontSize:'34px', color:'#1a1008'}).setOrigin(0.5);
      this.add.text(cx, 618, bigWord,
        {fontFamily:'"Press Start 2P"', fontSize:'34px', color:wordColor}).setOrigin(0.5);
      const turnsSub = t('turnsSubtitle', {n: gameState.turnCount});
      this.add.text(cx+1, 662, turnsSub,
        {fontFamily:'"Press Start 2P"', fontSize:'14px', color:'#1a1008'}).setOrigin(0.5);
      this.add.text(cx, 661, turnsSub,
        {fontFamily:'"Press Start 2P"', fontSize:'14px', color:wordColor}).setOrigin(0.5);
      this.roundButton(cx, 730, 40*this.fontScale, 0x2f8f4e, 0x5fdc7a, t('btnReplay'), ()=>this.restartGame());
    }
  }

  onPlayerFaceDownClick(card){
    if(gameState.turn!=='player' || gameState.winner || this.animating) return;
    this.armAnimating();
    const pileTopBefore = pileTop(gameState);
    const pileSnapshotBefore = [...gameState.pile];
    const res = tryFaceDownCard(gameState, 'player', card);
    selected = [];
    this.animateResult('player', res, pileTopBefore, pileSnapshotBefore);
  }

  onPlayerCardClick(card){
    if(gameState.turn!=='player' || gameState.winner || this.animating) return;
    if(this.awaitingFaceUpChoice){
      this.confirmTakePileWithFaceUp(card);
      return;
    }
    const idx = selected.findIndex(c=>c.id===card.id);
    if(idx>=0){ selected.splice(idx,1); }
    else {
      if(selected.length>0 && selected[0].rank!==card.rank) selected = [];
      selected.push(card);
    }
    this.render();
  }

  // ---- Depose (drag & drop) d'une carte : si lachee assez pres de la pile,
  // on tente de jouer (elle seule, ou tout le groupe selectionne si elle en
  // fait partie) ; sinon la carte revient simplement a sa place. ----
  // ---- Reordonne la main a la main (Normal/Difficile/Cauchemar) : calcule
  // l'index cible d'apres la position X ou la carte a ete lachee, relative a
  // l'espacement actuel de la main (this.handStartX/handSpacing, calcules a
  // chaque rendu). Ne fait rien en mode Facile (main toujours auto-triee).
  // Si la carte glissee fait partie d'un GROUPE selectionne, tout le groupe
  // se deplace ensemble (dans son ordre relatif d'origine) plutot que de
  // laisser les autres cartes du groupe sur place -- avant ce fix, seule la
  // carte glissee bougeait, ce qui donnait un affichage/resultat incoherent
  // des qu'on avait plusieurs cartes selectionnees. ----
  reorderHand(card, pointer){
    if(!this.handSpacing) return;
    const hand = gameState.player.hand;
    const group = (selected.length>0 && selected.some(s=>s.id===card.id)) ? [...selected] : [card];
    const groupIds = new Set(group.map(c=>c.id));
    // Le groupe garde son ordre relatif d'origine (pas l'ordre de selection).
    const groupInOrder = hand.filter(c=>groupIds.has(c.id));
    const rest = hand.filter(c=>!groupIds.has(c.id));
    const relativeX = pointer.worldX - this.handStartX;
    let targetIdx = Math.round(relativeX / this.handSpacing);
    targetIdx = Math.max(0, Math.min(rest.length, targetIdx));
    rest.splice(targetIdx, 0, ...groupInOrder);
    gameState.player.hand = rest;
  }

  onCardDropped(card, pointer){
    if(gameState.turn!=='player' || gameState.winner || this.animating || this.awaitingFaceUpChoice){
      this.render();
      return;
    }
    const dx = pointer.worldX - this.pileX;
    const dy = pointer.worldY - this.pileY;
    const closeEnough = Math.sqrt(dx*dx + dy*dy) < this.pileDropRadius;
    if(!closeEnough){
      // Pas lache sur la pile : en mode Normal/Difficile/Cauchemar, on
      // permet de reordonner sa main a la main plutot que de juste faire
      // revenir la carte a sa place (le mode Facile, lui, reste toujours
      // trie automatiquement, donc pas de reorder manuel a proposer).
      if(difficulty!=='easy') this.reorderHand(card, pointer);
      this.render();
      return;
    }

    const group = (selected.length>0 && selected.some(s=>s.id===card.id)) ? [...selected] : [card];

    // On capture la position LIVE de chaque carte du groupe (la ou le drag
    // les a laissees, pas leur position de repos en main) et on retire leurs
    // sprites de drag : l'animation de vol va prendre le relai exactement
    // de la, sans saut entre les deux animations.
    this.dragReleasePos = {};
    for(const c of group){
      const s = this.spriteByCardId[c.id];
      if(s){
        this.dragReleasePos[c.id] = { x:s.x, y:s.y, scale:s.scaleX };
        s.destroy();
        delete this.spriteByCardId[c.id];
      }
    }

    selected = group;
    this.onPlayClick();
  }

  onPlayClick(){
    if(selected.length===0 || this.animating || this.awaitingFaceUpChoice) return;
    this.armAnimating();
    const pileTopBefore = pileTop(gameState);
    const pileSnapshotBefore = [...gameState.pile];
    const res = playGroup(gameState, 'player', [...selected]);
    selected = [];
    if(!res.ok){ this.disarmWatchdog(); this.animating = false; this.render(); return; }
    this.animateResult('player', res, pileTopBefore, pileSnapshotBefore);
  }

  onTakeClick(){
    if(this.animating) return;
    // Annuler le choix en cours (re-clic sur le bouton pendant la selection)
    // reste toujours possible, meme si la pile est vide entre temps.
    if(this.awaitingFaceUpChoice){
      this.awaitingFaceUpChoice = false;
      this.render();
      return;
    }
    // Pile vide = n'importe quelle carte est jouable (deja la regle en
    // vigueur), donc "prendre le tas" n'a jamais de sens dans ce cas et ne
    // doit pas pouvoir sauter le tour gratuitement.
    if(gameState.pile.length===0) return;
    const pZoneInfo = getActiveZoneCards(gameState.player);
    // Mode Cauchemar : interdit de "prendre" si une carte de la zone active
    // est jouable -- on doit jouer si on peut, ramasser n'est reserve qu'aux
    // vrais blocages.
    if(difficulty==='nightmare'){
      const hasPlayable =
        (pZoneInfo.zone==='hand' && gameState.player.hand.some(c=>canPlayGroup(gameState, c.rank))) ||
        (pZoneInfo.zone==='faceUp' && gameState.player.faceUp.some(c=>canPlayGroup(gameState, c.rank)));
      if(hasPlayable) return;
    }
    // Phase "decouverte" (face visible) : on doit choisir une carte a
    // recuperer avec le tas avant de valider.
    if(pZoneInfo.zone==='faceUp' && gameState.player.faceUp.length>0){
      this.awaitingFaceUpChoice = true;
      selected = [];
      this.render();
      return;
    }
    this.armAnimating();
    const pileTopBefore = pileTop(gameState);
    const pileSnapshotBefore = [...gameState.pile];
    const res = forceTakePile(gameState, 'player');
    selected = [];
    this.animateResult('player', res, pileTopBefore, pileSnapshotBefore);
  }

  confirmTakePileWithFaceUp(card){
    if(this.animating) return;
    this.awaitingFaceUpChoice = false;
    this.armAnimating();
    const pileTopBefore = pileTop(gameState);
    const pileSnapshotBefore = [...gameState.pile];
    const res = forceTakePile(gameState, 'player', card);
    selected = [];
    this.animateResult('player', res, pileTopBefore, pileSnapshotBefore);
  }
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: '#12181f',
  scale: { mode: Phaser.Scale.RESIZE },
  // Par defaut, Phaser met le jeu en pause quand la fenetre/l'onglet perd le
  // focus, et ne reprend qu'au retour du focus. On desactive cette pause
  // automatique : le jeu doit continuer a tourner (animations, tour de l'IA)
  // meme si le focus de la fenetre bouge un peu.
  disableVisibilityChange: true,
  scene: [MenuScene, DifficultyScene, MainScene]
};
game = new Phaser.Game(config);
</script>
</body>
</html>
